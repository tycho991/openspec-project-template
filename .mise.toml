[tools]
node = "24.22.0"
"npm:@fission-ai/openspec" = "1.14.3"

[env]
OPENSPEC_TELEMETRY = "0"
DO_NOT_TRACK = "1"

# Profil und Delivery liest OpenSpec aus der globalen Config des Rechners
# (~/.config/openspec/config.json). Die Tasks setzen sie vor init und vor
# jedem Update, damit jeder Rechner und die CI dieselben Skills erzeugen.
[tasks.openspec-profile]
description = "OpenSpec-Profil und -Delivery fuer dieses Projekt setzen (vor openspec init)"
run = [
  "openspec config set profile core",
  "openspec config set delivery both",
]

[tasks.openspec-sync]
description = "Skills und Commands an die gepinnte OpenSpec-Version und das Projektprofil anpassen"
depends = ["openspec-profile"]
run = "openspec update --force"
