name: openspec-drift
on: [pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      # The template itself has no openspec/ yet - then there is nothing to check
      - uses: jdx/mise-action@v5          # installs node and openspec from .mise.toml
        if: hashFiles('openspec/config.yaml') != ''

      - name: Regenerate skills
        if: hashFiles('openspec/config.yaml') != ''
        run: mise run openspec-sync

      - name: Skills must match the pinned version and profile
        if: hashFiles('openspec/config.yaml') != ''
        run: |
          git add -A
          git diff --cached --stat --exit-code

      - name: Check skill names
        run: |
          rc=0
          for f in .claude/skills/*/SKILL.md; do
            [ -e "$f" ] || continue
            name=$(basename "$(dirname "$f")")
            echo "$name" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$' || { echo "::error file=$f::invalid skill name $name"; rc=1; }
            grep -Eq '^description:[[:space:]]*[^[:space:]]' "$f" || { echo "::error file=$f::description is missing"; rc=1; }
          done
          exit $rc
