name: openspec-drift
on: [pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      # Die Vorlage selbst hat noch kein openspec/ - dann gibt es nichts zu pruefen
      - uses: jdx/mise-action@v5          # installiert node und openspec aus .mise.toml
        if: hashFiles('openspec/config.yaml') != ''

      - name: Skills neu erzeugen
        if: hashFiles('openspec/config.yaml') != ''
        run: mise run openspec-sync

      - name: Skills muessen zu Version und Profil passen
        if: hashFiles('openspec/config.yaml') != ''
        run: |
          git add -A
          git diff --cached --stat --exit-code

      - name: Skill-Struktur pruefen
        run: |
          rc=0
          [ -d .opencode/skills ] || exit 0
          # OpenCode 2 macht aus losen *.md und tieferen SKILL.md weitere Skills
          for f in $(find .opencode/skills -maxdepth 1 -type f -name '*.md') \
                   $(find .opencode/skills -mindepth 3 -name SKILL.md); do
            echo "::error file=$f::wird von OpenCode als zusaetzlicher Skill geladen"; rc=1
          done
          for f in .opencode/skills/*/SKILL.md; do
            [ -e "$f" ] || continue
            id=$(basename "$(dirname "$f")")
            echo "$id" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$' || { echo "::error file=$f::ungueltige Skill-ID $id"; rc=1; }
            grep -Eq '^description:[[:space:]]*[^[:space:]]' "$f" || { echo "::error file=$f::description fehlt"; rc=1; }
          done
          exit $rc
